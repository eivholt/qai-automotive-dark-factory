[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qai-automotive-dark-factory"
version = "0.1.0"
description = "Unreal dark factory inspection demo and IQ9 inference bridge"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
dark-factory-bridge = "dark_factory.bridge:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/qai-automotive-dark-factory" = ["configs/inspection_contract.json", "configs/process_inspection.json"]
